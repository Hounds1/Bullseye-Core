# Host name is detected automatically when omitted.
bullseye.application=host

bullseye.sampling.interval=5s
bullseye.window.duration=30m
bullseye.state.output=/run/bullseye/state.json

bullseye.diagnostics.cpu.elevated.threshold=70
bullseye.diagnostics.cpu.elevated.duration=10s
bullseye.diagnostics.cpu.high.threshold=80
bullseye.diagnostics.cpu.high.duration=10s
bullseye.diagnostics.cpu.high.minimum-rise=0
bullseye.diagnostics.cpu.critical.threshold=90
bullseye.diagnostics.cpu.critical.duration=5s
bullseye.diagnostics.cpu.recovery.threshold=65
bullseye.diagnostics.cpu.recovery.duration=30s
bullseye.diagnostics.cpu.psi.corroboration-threshold=5
bullseye.diagnostics.cpu.psi.recovery-threshold=1

# Memory usage is never considered pressure without matching PSI.
bullseye.diagnostics.memory.elevated.usage=80
bullseye.diagnostics.memory.elevated.psi-some=10
bullseye.diagnostics.memory.elevated.duration=10s
bullseye.diagnostics.memory.high.usage=85
bullseye.diagnostics.memory.high.psi-some=20
bullseye.diagnostics.memory.high.minimum-rise=0
bullseye.diagnostics.memory.high.duration=10s
bullseye.diagnostics.memory.critical.usage=90
bullseye.diagnostics.memory.critical.psi-some=40
bullseye.diagnostics.memory.critical.psi-full=5
bullseye.diagnostics.memory.critical.duration=5s
bullseye.diagnostics.memory.recovery.usage=70
bullseye.diagnostics.memory.recovery.psi-some=2
bullseye.diagnostics.memory.recovery.psi-full=1
bullseye.diagnostics.memory.recovery.duration=30s

bullseye.diagnostics.io.elevated.psi-some=10
bullseye.diagnostics.io.elevated.duration=10s
bullseye.diagnostics.io.high.psi-some=25
bullseye.diagnostics.io.high.psi-full=3
bullseye.diagnostics.io.high.duration=10s
bullseye.diagnostics.io.critical.psi-full=10
bullseye.diagnostics.io.critical.duration=5s
bullseye.diagnostics.io.recovery.psi-some=2
bullseye.diagnostics.io.recovery.psi-full=1
bullseye.diagnostics.io.recovery.duration=30s

bullseye.cgroup.enabled=true
bullseye.cgroup.root=/sys/fs/cgroup
bullseye.cgroup.discovery-interval=60s
bullseye.cgroup.sampling-interval=5s
bullseye.cgroup.maximum-depth=8
bullseye.cgroup.maximum-groups=512
bullseye.cgroup.attribution.minimum-score=5
bullseye.cgroup.attribution.dominance-ratio=1.2

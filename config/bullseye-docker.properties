# Fast, deliberately sensitive thresholds for the Docker smoke test.
bullseye.host=bullseye-docker
bullseye.application=smoke-test

bullseye.sampling.interval=1s
bullseye.window.duration=1m
bullseye.state.output=/run/bullseye/state.json

bullseye.diagnostics.cpu.elevated.threshold=0.001
bullseye.diagnostics.cpu.elevated.duration=2s
bullseye.diagnostics.cpu.high.threshold=90
bullseye.diagnostics.cpu.high.duration=2s
bullseye.diagnostics.cpu.high.minimum-rise=1
bullseye.diagnostics.cpu.critical.threshold=99
bullseye.diagnostics.cpu.critical.duration=2s
bullseye.diagnostics.cpu.recovery.threshold=0
bullseye.diagnostics.cpu.recovery.duration=3s

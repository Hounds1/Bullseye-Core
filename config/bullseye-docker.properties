# Fast, deliberately sensitive thresholds for the Docker smoke test.
bullseye.host=bullseye-docker
bullseye.application=smoke-test

bullseye.sampling.interval=1s
bullseye.window.duration=1m
bullseye.state.output=/run/bullseye/state.json

bullseye.diagnostics.cpu.elevated.threshold=0.001
bullseye.diagnostics.cpu.elevated.duration=2s
bullseye.diagnostics.cpu.high.threshold=90
bullseye.diagnostics.cpu.high.duration=2s
bullseye.diagnostics.cpu.high.minimum-rise=1
bullseye.diagnostics.cpu.critical.threshold=99
bullseye.diagnostics.cpu.critical.duration=2s
bullseye.diagnostics.cpu.recovery.threshold=0
bullseye.diagnostics.cpu.recovery.duration=3s
bullseye.diagnostics.cpu.psi.corroboration-threshold=5
bullseye.diagnostics.cpu.psi.recovery-threshold=1

bullseye.cgroup.enabled=true
bullseye.cgroup.discovery-interval=60s
# Shared by CPU, memory, and IO HIGH attribution; CPU/IO first need two fresh snapshots.
bullseye.cgroup.attribution.refresh-interval=30s
# Keep CPU and memory confidence confirmation consistent with production defaults.
bullseye.cgroup.attribution.confidence.minimum-observations=3
bullseye.cgroup.attribution.confidence.minimum-duration=10s
# Set to 0 to rely only on regular attribution observations.
bullseye.cgroup.attribution.confidence.maximum-confirmation-collections=3
bullseye.cgroup.attribution.confidence.minimum-margin=5
